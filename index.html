dth:100%;min-width:0}.field input:focus,.answer:focus{outline:2px solid #94afff}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.split{display:grid;grid-template-columns:1.3fr .7fr;gap:18px}.question{font-size:clamp(34px,6vw,62px);font-weight:850;letter-spacing:-2px;min-height:104px;display:grid;place-items:center;text-align:center}.answer{font-size:26px;text-align:center;max-width:360px}.center{text-align:center}.divider{height:1px;background:var(--border);margin:19px 0}.status{font-size:13px;font-weight:700;min-height:22px}.ok{color:#178263}.bad{color:#ca4a51}.bar{background:#e9eef8;border-radius:9px;height:9px;overflow:hidden}.bar>div{height:100%;background:#4d70e6;border-radius:9px}.history{width:100%;border-collapse:collapse;font-size:13px}.history th{text-align:left;color:#6b7890;font-size:11px;text-transform:uppercase;letter-spacing:.6px}.history td,.history th{padding:12px 8px;border-bottom:1px solid #ebeff6}.news{border-left:3px solid #5274e5;padding:0 0 0 13px;margin:20px 0}.breath{height:160px;width:160px;border-radius:50%;background:radial-gradient(circle,#c1d8ff,#5575d8);margin:15px auto;display:grid;place-items:center;color:white;font-weight:800;transition:transform 4s ease-in-out;box-shadow:0 0 0 15px #eaf1ff}.breath.in{transform:scale(1.2)}.hide{display:none!important}.result{font-size:45px;color:#3159dd;font-weight:850}.empty{padding:28px 0;color:#8a96aa;text-align:center;font-size:13px}.info{background:#f0f4ff;color:#38518d;border:1px solid #dce6ff;border-radius:11px;padding:12px 14px;font-size:13px;line-height:1.55}.chart{display:flex;align-items:end;gap:7px;height:160px;padding-top:14px;border-bottom:1px solid #dce4f0}.chartbar{flex:1;min-width:10px;background:#5977e9;border-radius:6px 6px 0 0;position:relative}.chartbar:hover{background:#3159dd}.chartbar span{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);font-size:10px;color:#5a6a86}.listline{display:flex;align-items:center;justify-content:space-between;padding:1 </style></head><body><div class="app"><aside class="sidebar"><div class="brand"><div class="brandmark">∑</div><div><strong>MentalMath</strong><small>EDICIÓN 2027</small></div></div><nav class="nav" id="nav"><button data-page="home" class="active">⌂ &nbsp; Inicio</button><button data-page="training">▦ &nbsp; Entrenar</button><button data-page="progress">▥ &nbsp; Estadísticas</button><button data-page="ranking">♛ &nbsp; Clasificación</button><button data-page="tournaments">◈ &nbsp; Torneos</button><button data-page="relax">◉ &nbsp; Concentración</button><button data-page="community">▤ &nbsp; Comunidad</button><button data-page="profiles">⚙ &nbsp; Perfiles</button></nav><div class="sidefoot">Entrenamiento inclusivo<br>Infantil · Primaria · ESO · Adultos</div></aside><main class="main"><header class="top"><div><div class="eyebrow">Academia de cálculo mental</div><h1 id="pageTitle">Tu entrenamiento empieza aquí</h1><p class="sub" id="pageSub">Practica, aprende estrategias y sigue tu evolución.</p></div><div class="topright"><span class="chip" id="ageBadge">Todas las edades</span><div class="row" style="gap:7px"><div class="avatar" id="avatar">A</div><select id="profileSelect" aria-label="Perfil" style="border:0;background:transparent;max-width:150px;font-weight:700"></select></div></div></header><div id="screen"></div></main></div>
<script>
'use strict';
const KEY='mentalmath2027-v1';const defaultData={profiles:[{id:'demo',name:'Mi perfil',age:'adult',country:'🇪🇸',group:'Individual'}],active:'demo',sessions:[],posts:[],tournaments:[]};
let state;try{state=JSON.parse(localStorage.getItem(KEY))||structuredClone(defaultData)}catch(e){state=JSON.parse(JSON.stringify(defaultData))}if(!state.profiles?.length)state=JSON.parse(JSON.stringify(defaultData));const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}};
const $=id=>document.getElementById(id),screen=$('screen');const safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const active=()=>state.profiles.find(p=>p.id===state.active)||state.profiles[0];const sess=()=>state.sessions.filter(s=>s.profile===active().id);const ageNames={infant:'Infantil 3–5',primary:'Primaria 6–11',teen:'ESO 12–16',youth:'Jóvenes 17–25',adult:'Adultos 26+'};const cats=[['Sumas','Sumas rápidas, compensación y cálculo encadenado','+'],['Restas','Diferencias, saltos y cálculo inverso','−'],['Multiplicaciones','Tablas, dobles y productos especiales','×'],['Divisiones','Repartos, factores y cocientes','÷'],['Potencias y raíces','Cuadrados, cubos y raíces exactas','²'],['Estrategias','Redondeo, porcentajes y descomposición','%'],['Memoria numérica','Series, patrones y memoria de trabajo','◈'],['Competición','Velocidad, precisión y resistencia','★']];const suffix=['Fundamentos','Sin llevar / directo','Progresivo','Desafío inverso','Cadenas','Contrarreloj'];const modes=cats.flatMap(([cat,desc,icon],c)=>suffix.map((name,i)=>({id:c*6+i,c,i,cat,title:name,desc})));const r=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;const choice=a=>a[r(0,a.length-1)];let page='home',filter='Todos',selectedMode=0,game=null,tick=null,breathTimer=null,breathPhase=0;
const count=sessList=>sessList.length, accuracy=s=>s?.length?Math.round(s.reduce((a,x)=>a+x.correct,0)/Math.max(1,s.reduce((a,x)=>a+x.total,0))*100):0;
function profileUi(){const p=active();$('profileSelect').innerHTML=state.profiles.map(x=>`<option value="${safe(x.id)}" ${x.id===p.id?'selected':''}>${safe(x.name)}</option>`).join('');$('avatar').textContent=p.name.trim().charAt(0).toUpperCase()||'M';$('ageBadge').textContent=ageNames[p.age]||'Adultos';}
$('profileSelect').onchange=e=>{state.active=e.target.value;save();route('home')};$('nav').onclick=e=>{let btn=e.target.closest('button[data-page]');if(btn)route(btn.dataset.page)};
const titles={home:['Tu entrenamiento empieza aquí','Practica, aprende estrategias y sigue tu evolución.'],training:['Centro de entrenamiento','48 modalidades originales adaptadas a tu etapa.'],progress:['Tu evolución','Información de los entrenamientos de este perfil.'],ranking:['Clasificaciones','Comparación local entre los perfiles de este dispositivo.'],tournaments:['Torneos y campeonatos','Competiciones de práctica y simulacros locales.'],relax:['Concentración y relajación','Siete rutinas con instrucciones habladas.'],community:['Blog y comunidad','Recursos y anotaciones guardados en este dispositivo.'],profiles:['Gestión de perfiles','Crea cuentas locales para todas las edades.']};
function route(to){if(game?.active&&to!=='play')finish();stopBreath();page=to;profileUi();document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===to));const t=titles[to]||titles.home;$('pageTitle').textContent=t[0];$('pageSub').textContent=t[1];({home,training,progress,ranking,tournaments,relax,community,profiles,play:gamePage,results:resultsPage})[to]?.();window.scrollTo({top:0,behavior:'instant'});}
function home(){const s=sess(),sum=s.reduce((n,x)=>n+x.correct,0),total=s.reduce((n,x)=>n+x.total,0);screen.innerHTML=`<section class="hero"><div><span style="font-size:12px;letter-spacing:1.4px;color:#b5c5ff;font-weight:800">RUMBO A 2027</span><h2>Una mente más ágil,<br>un reto cada día.</h2><p>Empieza por tu nivel y avanza a tu ritmo. Entrenamiento desde el pensamiento matemático temprano hasta los desafíos de alta velocidad.</p><button class="primary" onclick="route('training')">Empezar a entrenar →</button></div><div class="heroart">12<br>× 8<br>96</div></section><div class="grid g4"><div class="card"><div class="muted small">Sesiones</div><div class="stat">${s.length}</div><span class="tag">Completadas</span></div><div class="card"><div class="muted small">Aciertos</div><div class="stat">${sum}</div><span class="tag">Respuestas correctas</span></div><div class="card"><div class="muted small">Precisión</div><div class="stat">${total?Math.round(100*sum/total):0}%</div><span class="tag">Global</span></div><div class="card"><div class="muted small">Puntuación</div><div class="stat">${s.reduce((n,x)=>n+x.score,0)}</div><span class="tag">Puntos acumulados</span></div></div><div class="section"><h2>Entrenamientos recomendados</h2><button class="secondary" onclick="route('training')">Ver los 48 →</button></div><div class="grid g3">${[0,12,36].map(id=>modeCard(modes[id])).join('')}</div><div class="section"><h2>Tu próxima meta</h2></div><div class="grid g2"><div class="card"><h3>Desafío diario</h3><p class="sub">Completa 10 ejercicios en el modo sugerido. La práctica diaria crea un historial de progreso.</p><div style="margin-top:16px"><button class="primary" onclick="launch(42,10,0)">Hacer desafío →</button></div></div><div class="card"><h3>Preparación para competir</h3><p class="sub">Simula una prueba con 20 ejercicios y observa tu precisión y tiempo total.</p><div style="margin-top:16px"><button class="secondary" onclick="launch(47,20,0)">Iniciar simulacro →</button></div></div></div>`;}
function modeCard(m){return `<article class="card mode" onclick="launch(${m.id})"><div class="row" style="justify-content:space-between"><span class="tag">${m.cat}</span><span class="index">#${String(m.id+1).padStart(2,'0')}</span></div><h3 style="margin-top:15px">${m.title}</h3><p>${m.desc}</p><div style="color:#3159dd;font-weight:800;font-size:12px">Entrenar →</div></article>`}
function training(){let visible=filter==='Todos'?modes:modes.filter(m=>m.cat===filter);screen.innerHTML=`<div class="info">El nivel inicial se adapta al perfil (${ageNames[active().age]}). Puedes ajustar la dificultad de cada entrenamiento. En Infantil los problemas usan cantidades pequeñas y símbolos visuales.</div><div class="pillrow">${['Todos',...cats.map(x=>x[0])].map(x=>`<button class="pill ${filter===x?'on':''}" onclick="filter=${JSON.stringify(x).replace(/"/g,'&quot;')};training()">${x}</button>`).join('')}</div><div class="section"><h2>${filter==='Todos'?'Todos los simuladores':filter} <span class="muted small">(${visible.length})</span></h2></div><div class="grid g3">${visible.map(modeCard).join('')}</div>`;}
function generate(mode,difficulty,age){const c=mode.c,v=mode.i;let level=difficulty,small=age==='infant';let max=small?5:level===1?12:level===2?30:level===3?100:level===4?500:2000;let a,b,ans,display,hint='',kind='number';const cap=()=>r(1,max);switch(c){case 0:a=cap();b=cap();if(v===1){a=r(1,9)*10;b=r(1,9)*10}if(v===3){ans=cap();a=cap();display=`${a} + ? = ${a+ans}`;hint='Busca cuánto falta para llegar al total.';break}if(v===4){let cc=cap();ans=a+b+cc;display=`${a} + ${b} + ${cc}`;hint='Agrupa números que sumen decenas o centenas.';break}ans=a+b;display=`${a} + ${b}`;hint='Descompón uno de los sumandos.';break;case 1:a=cap();b=cap();if(a<b)[a,b]=[b,a];if(v===3){ans=b;display=`${a} − ? = ${a-b}`;break}if(v===4){let d=r(1,Math.max(2,Math.floor(max/3)));a+=d;ans=a-b-d;display=`${a} − ${b} − ${d}`;break}ans=a-b;display=`${a} − ${b}`;hint='Piensa en la distancia entre los números.';break;case 2:a=r(2,small?3:Math.min(12,Math.max(4,level*4)));b=r(1,small?3:Math.min(25,Math.max(6,level*6)));if(v===1){a=choice([2,5,10]);b=r(1,small?3:level*12)}if(v===3){ans=b;display=`${a} × ? = ${a*b}`;break}if(v===4){let k=r(2,5);ans=a*b+a*k;display=`${a} × ${b} + ${a} × ${k}`;break}ans=a*b;display=`${a} × ${b}`;hint='Usa dobles, tablas o la propiedad distributiva.';break;case 3:b=r(2,small?3:level*4+3);ans=r(1,small?3:level*5+4);a=b*ans;if(v===3){display=`? ÷ ${b} = ${ans}`;ans=a;break}if(v===4){let cc=r(1,level*3+2),x=ans;display=`${a+b*cc} ÷ ${b} − ${cc}`;ans=x;break}display=`${a} ÷ ${b}`;hint='Busca qué número multiplicado por el divisor da el dividendo.';break;case 4:{let n=r(2,small?3:level===1?9:level===2?15:level===3?22:level===4?30:40);let type=v%4;if(type===0){display=`${n}²`;ans=n*n}else if(type===1){display=`√${n*n}`;ans=n}else if(type===2){n=r(2,level+3);display=`${n}³`;ans=n**3}else{n=r(2,level+3);display=`∛${n**3}`;ans=n}hint='Busca potencias conocidas y relaciones inversas.';break}case 5:{let x=r(2,level*12+8);if(v===0){let target=10**Math.min(3,Math.max(1,level));ans=target-x;display=`${x} + ? = ${target}`;if(ans<0){ans=100-x;display=`${x} + ? = 100`}}else if(v===1){let n=r(1,level*8+5);display=`${n} × 11`;ans=n*11}else if(v===2){let n=r(2,level*8+6);display=`${n} × 25`;ans=n*25}else if(v===3){let n=r(2,Math.min(100,level*16+9))*10;display=`10% de ${n}`;ans=n/10}else if(v===4){let n=r(2,level*20+10)*4;display=`25% de ${n}`;ans=n/4}else{let n=r(1,level*50+10);display=`${n} + 99`;ans=n+99}hint='Prueba una transformación más sencilla antes de operar.';break}case 6:{let start=r(1,small?3:level*10+5),step=r(1,small?2:level*4+2);if(v===1){display=`${start}, ${start*2}, ${start*4}, ?`;ans=start*8}else if(v===3){display=`${start+3*step}, ${start+2*step}, ${start+step}, ?`;ans=start}else if(v===4){display=`${start}, ${start+step}, ${start+3*step}, ?`;ans=start+6*step}else{display=`${start}, ${start+step}, ${start+2*step}, ?`;ans=start+3*step}hint='Identifica qué cambia de un término al siguiente.';break}case 7:{let types=['+', '−','×','÷'];let op=small?choice(['+','−']):choice(types);let mm={c:types.indexOf(op),i:v};return generate(mm,difficulty,age)} }
if(small&&c>=2&&c<=5){let n=r(1,5),k=r(1,5);display=c===4?`${n} + ${n}`:c===5?`${n} + ? = ${n+k}`:`${n} + ${k}`;ans=c===4?2*n:c===5?k:n+k;hint='Puedes contar con los dedos o con objetos.'}
return {display,answer:ans,hint,kind};}
function launch(id=0,forcedTotal=null,forcedTime=null){selectedMode=id;const mode=modes[id],age=active().age;let d=age==='infant'?1:age==='primary'?2:age==='teen'?3:age==='youth'?4:3;stopBreath();game={mode,d,total:forcedTotal||10,limit:forcedTime??0,correct:0,wrong:0,answers:[],index:0,active:false,forcedTotal,forcedTime};page='play';$('pageTitle').textContent=mode.cat+' · '+mode.title;$('pageSub').textContent='Configura tu sesión de entrenamiento.';renderSetup();}
function renderSetup(){const g=game;screen.innerHTML=`<div class="split"><section class="card"><span class="tag">Simulador #${g.mode.id+1}</span><h2 style="margin-top:16px">${g.mode.cat}: ${g.mode.title}</h2><p class="sub">${g.mode.desc}. Responde sin calculadora. Cada operación vale 10 puntos si aciertas.</p><div class="divider"></div><div class="grid g2"><label class="field">Dificultad<select id="gameDiff">${[1,2,3,4,5].map(n=>`<option value="${n}" ${n===g.d?'selected':''}>${['Inicial','Básica','Intermedia','Avanzada','Experta'][n-1]}</option>`).join('')}</select></label><label class="field">Preguntas<select id="gameCount"><option value="5">5 preguntas</option><option value="10" ${g.total===10?'selected':''}>10 preguntas</option><option value="20" ${g.total===20?'selected':''}>20 preguntas</option><option value="50">50 preguntas</option></select></label><label class="field">Tiempo máximo<select id="gameLimit"><option value="0">Sin límite</option><option value="60">1 minuto</option><option value="120">2 minutos</option><option value="300">5 minutos</option></select></label></div><div style="margin-top:23px" class="row"><button class="primary" onclick="startGame()">Empezar prueba →</button><button class="ghost" onclick="route('training')">Volver</button></div></section><aside class="card"><h3>Consejo de entrenamiento</h3><p class="sub">Para mejorar, combina sesiones de precisión con sesiones cronometradas. Los resultados se guardan en el perfil activo de este navegador.</p><div class="divider"></div><h3>Perfil actual</h3><p class="sub">${safe(active().name)} · ${ageNames[active().age]}</p></aside></div>`;$('gameCount').value=String(g.total);$('gameLimit').value=String(g.limit);}
function startGame(){const g=game;g.d=Number($('gameDiff').value);g.total=Number($('gameCount').value);g.limit=Number($('gameLimit').value);g.correct=0;g.wrong=0;g.index=0;g.answers=[];g.active=true;g.start=performance.now();g.questionStart=performance.now();g.problem=generate(g.mode,g.d,active().age);gamePage();clearInterval(tick);tick=setInterval(updateClock,150);}
function updateClock(){if(!game?.active)return;let elapsed=(performance.now()-game.start)/1000;if($('timeDisplay'))$('timeDisplay').textContent=game.limit?Math.max(0,game.limit-elapsed).toFixed(0)+' s':elapsed.toFixed(0)+' s';if(game.limit&&elapsed>=game.limit)finish();}
function gamePage(){const g=game;screen.innerHTML=`<div class="split"><section class="card"><div class="row" style="justify-content:space-between"><span class="tag">Pregunta <span id="qindex">${g.index+1}</span> / ${g.total}</span><span class="chip">⏱ <span id="timeDisplay">0 s</span></span></div><div style="margin-top:20px" class="bar"><div id="qbar" style="width:${100*g.index/g.total}%"></div></div><div class="question" id="problem">${safe(g.problem.display)} = ?</div><form id="answerForm" class="center" onsubmit="submitAnswer(event)"><input id="answerInput" class="answer" type="number" step="any" inputmode="decimal" autocomplete="off" required aria-label="Resultado" placeholder="Tu respuesta"><div style="margin-top:12px"><button class="primary" type="submit">Responder ↵</button></div></form><div id="feedback" class="status center" style="margin-top:16px" aria-live="polite"></div><div class="divider"></div><button class="ghost" onclick="finish()">Finalizar sesión</button></section><aside class="card"><h3>Marcador</h3><div class="grid g2"><div><div class="small muted">Aciertos</div><div class="stat ok" id="goodCount">${g.correct}</div></div><div><div class="small muted">Errores</div><div class="stat bad" id="badCount">${g.wrong}</div></div></div><div class="divider"></div><h3>Ayuda de estrategia</h3><p class="sub" id="hint">${safe(g.problem.hint||'Busca un procedimiento mental sencillo.')}</p><div class="divider"></div><p class="note">El objetivo es resolver con seguridad y mejorar con la práctica. Las respuestas incorrectas también sirven para identificar qué entrenar.</p></aside></div>`;$('answerInput').focus();}
function submitAnswer(ev){ev.preventDefault();const g=game;if(!g?.active)return;const v=Number($('answerInput').value);if(!Number.isFinite(v))return;const ok=Math.abs(v-g.problem.answer)<1e-8;let seconds=(performance.now()-g.questionStart)/1000;g.answers.push({question:g.problem.display,expected:g.problem.answer,given:v,ok,seconds});g.index++;if(ok)g.correct++;else g.wrong++;if(g.index>=g.total){finish();return}g.problem=generate(g.mode,g.d,active().age);g.questionStart=performance.now();$('problem').textContent=g.problem.display+' = ?';$('qindex').textContent=g.index+1;$('qbar').style.width=100*g.index/g.total+'%';$('goodCount').textContent=g.correct;$('badCount').textContent=g.wrong;$('hint').textContent=g.problem.hint||'Busca un procedimiento mental sencillo.';$('feedback').textContent=ok?'Correcto':'Respuesta anterior: '+g.answers.at(-1).expected;$('feedback').className='status center '+(ok?'ok':'bad');$('answerInput').value='';$('answerInput').focus();}
function finish(){if(!game?.active)return;game.active=false;clearInterval(tick);const g=game;g.elapsed=Math.round((performance.now()-g.start)/100)/10;g.score=g.correct*10;let entry={id:Date.now()+'-'+Math.random().toString(36).slice(2,6),profile:active().id,date:new Date().toISOString(),mode:g.mode.id,level:g.d,correct:g.correct,total:g.answers.length,wrong:g.wrong,elapsed:g.elapsed,score:g.score,answers:g.answers};state.sessions.push(entry);save();route('results');}
function resultsPage(){const g=game;if(!g)return route('home');let total=g.answers.length,acc=total?Math.round(100*g.correct/total):0;screen.innerHTML=`<div class="card center"><div class="eyebrow">Sesión completada</div><h2 style="margin-top:12px">${g.mode.cat} · ${g.mode.title}</h2><div class="result">${g.score} puntos</div><div class="grid g4" style="margin:26px 0"><div><div class="stat">${g.correct}</div><div class="small muted">Aciertos</div></div><div><div class="stat">${acc}%</div><div class="small muted">Precisión</div></div><div><div class="stat">${g.elapsed}s</div><div class="small muted">Tiempo total</div></div><div><div class="stat">${total?(g.elapsed/total).toFixed(1):'—'}s</div><div class="small muted">Tiempo medio</div></div></div><div class="info">${acc<70?'Practica con menor dificultad y trabaja las operaciones falladas.':acc<90?'Buen avance. Revisa tus errores antes de aumentar la velocidad.':'Precisión alta. Puedes subir un nivel o reducir el tiempo de la prueba.'}</div><div class="row" style="justify-content:center;margin-top:20px"><button class="primary" onclick="launch(${g.mode.id})">Repetir modalidad</button><button class="secondary" onclick="route('progress')">Ver estadísticas</button></div></div><div class="section"><h2>Corrección de respuestas</h2></div><div class="card" style="overflow:auto"><table class="history"><thead><tr><th>Operación</th><th>Tu respuesta</th><th>Correcta</th><th>Tiempo</th></tr></thead><tbody>${g.answers.map(a=>`<tr><td>${safe(a.question)}</td><td class="${a.ok?'ok':'bad'}">${a.given}</td><td>${a.expected}</td><td>${a.seconds.toFixed(1)} s</td></tr>`).join('')}</tbody></table></div>`;}
function progress(){const s=sess().slice().reverse(),sum=s.reduce((n,x)=>n+x.correct,0),total=s.reduce((n,x)=>n+x.total,0),peak=Math.max(10,...s.slice(-12).map(x=>x.score));screen.innerHTML=`<div class="grid g4"><div class="card"><div class="small muted">Sesiones realizadas</div><div class="stat">${s.length}</div></div><div class="card"><div class="small muted">Operaciones</div><div class="stat">${total}</div></div><div class="card"><div class="small muted">Precisión</div><div class="stat">${total?Math.round(100*sum/total):0}%</div></div><div class="card"><div class="small muted">Puntos acumulados</div><div class="stat">${s.reduce((n,x)=>n+x.score,0)}</div></div></div><div class="section"><h2>Evolución de puntuación</h2></div><div class="card"><div class="chart">${s.length?s.slice(-12).map(x=>`<div class="chartbar" title="${x.score} puntos" style="height:${Math.max(5,100*x.score/peak)}%"><span>${x.score}</span></div>`).join(''):'<div class="empty" style="width:100%">Todavía no hay entrenamientos.</div>'}</div><p class="note">Últimas 12 sesiones · Puntos por sesión</p></div><div class="section"><h2>Historial</h2><button class="secondary" onclick="exportCSV()">Exportar CSV ↓</button></div><div class="card" style="overflow:auto">${!s.length?'<div class="empty">Los entrenamientos aparecerán aquí.</div>':`<table class="history"><thead><tr><th>Fecha</th><th>Modalidad</th><th>Aciertos</th><th>Precisión</th><th>Tiempo</th><th>Puntos</th></tr></thead><tbody>${s.map(x=>`<tr><td>${new Date(x.date).toLocaleDateString('es-ES')}</td><td>${safe(modes[x.mode]?.cat||'Reto')} · ${safe(modes[x.mode]?.title||'Libre')}</td><td>${x.correct}/${x.total}</td><td>${x.total?Math.round(x.correct*100/x.total):0}%</td><td>${x.elapsed}s</td><td><b>${x.score}</b></td></tr>`).join('')}</tbody></table>`}</div>`;}
function exportCSV(){const rows=[['Fecha','Perfil','Modalidad','Nivel','Aciertos','Total','Segundos','Puntos'],...sess().map(x=>[x.date,active().name,modes[x.mode]?.cat+' / '+modes[x.mode]?.title,x.level,x.correct,x.total,x.elapsed,x.score])];const csv='\ufeff'+rows.map(row=>row.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(';')).join('\r\n');download('MentalMath_estadisticas.csv',csv,'text/csv;charset=utf-8');}
function download(filename,data,mime){const a=document.createElement('a'),url=URL.createObjectURL(new Blob([data],{type:mime}));a.href=url;a.download=filename;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),500);}
function ranking(){const board=state.profiles.map(p=>{let ss=state.sessions.filter(x=>x.profile===p.id);return {...p,score:ss.reduce((n,x)=>n+x.score,0),sessions:ss.length,accuracy:accuracy(ss)}}).sort((a,b)=>b.score-a.score);screen.innerHTML=`<div class="info">Clasificación de práctica: solo incluye perfiles creados en este navegador. No representa una clasificación global ni oficial. Las edades no se mezclan en competición formal.</div><div class="section"><h2>Clasificación local</h2></div><div class="card">${board.map((p,i)=>`<div class="listline"><div class="row"><span class="numbadge">${i+1}</span><div><b>${safe(p.country)} ${safe(p.name)}</b><div class="small muted">${safe(ageNames[p.age])} · ${safe(p.group)} · ${p.sessions} sesiones</div></div></div><div class="center"><b>${p.score} pts</b><div class="small muted">${p.accuracy}% precisión</div></div></div>`).join('')}</div>`;}
function tournaments(){let entries=state.tournaments.filter(x=>x.profile===active().id);screen.innerHTML=`<div class="grid g3"><div class="card"><span class="tag">Práctica</span><h3 style="margin-top:12px">Copa de precisión</h3><p class="sub">20 ejercicios sin límite de tiempo. Gana quien más acierte.</p><div style="margin-top:18px"><button class="primary" onclick="tourney(0)">Participar</button></div></div><div class="card"><span class="tag">Contrarreloj</span><h3 style="margin-top:12px">Sprint de 60 segundos</h3><p class="sub">Hasta 50 ejercicios. El cronómetro limita la prueba.</p><div style="margin-top:18px"><button class="primary" onclick="tourney(1)">Participar</button></div></div><div class="card"><span class="tag">Resistencia</span><h3 style="margin-top:12px">Gran reto de 50</h3><p class="sub">50 operaciones para trabajar constancia y concentración.</p><div style="margin-top:18px"><button class="primary" onclick="tourney(2)">Participar</button></div></div></div><div class="section"><h2>Registro de torneos</h2></div><div class="card">${entries.length?entries.map(x=>`<div class="listline"><span>${safe(x.label)} · ${new Date(x.date).toLocaleDateString('es-ES')}</span><b>${x.score} puntos</b></div>`).join(''):'<div class="empty">Participa en tu primer torneo de práctica.</div>'}</div><p class="note">Estos torneos son simulaciones locales. La participación simultánea, anti-trampas y rankings entre centros requerirán un servidor.</p>`;}
function tourney(which){const id=which===0?42:which===1?43:47;const total=which===0?20:50,limit=which===1?60:0;launch(id,total,limit);game.tournament=['Copa de precisión','Sprint de 60 segundos','Gran reto de 50'][which];}
const originalFinish=finish;finish=function(){if(!game?.active)return;let name=game.tournament;originalFinish();if(name){state.tournaments.push({profile:active().id,label:name,date:new Date().toISOString(),score:game.score});save();}};
const techniques=[['Respiración 4–4','Inspira durante cuatro segundos y espira durante cuatro segundos.','Inspira con calma durante cuatro segundos.','Expulsa el aire suavemente durante cuatro segundos.'],['Respiración 4–6','Inspira cuatro segundos y espira seis.','Inspira por la nariz durante cuatro segundos.','Espira lentamente durante seis segundos.'],['Atención al presente','Observa la respiración sin juzgar ni forzar.','Presta atención a cómo entra el aire.','Observa cómo sale el aire.'],['Relajación muscular','Afloja hombros, mandíbula y manos.','Deja caer los hombros y relaja las manos.','Suelta la tensión de la mandíbula y el cuello.'],['Visualización positiva','Imagina una sesión de cálculo tranquila y concentrada.','Visualiza el inicio de tu entrenamiento.','Imagínate resolviendo con calma y precisión.'],['Cuenta regresiva','Cuenta mentalmente desde diez hasta uno, sin prisa.','Cuenta mentalmente desde diez hasta seis.','Continúa desde cinco hasta uno con tranquilidad.'],['Preparación antes de competir','Rutina breve para atender a la tarea y recuperar la calma.','Siente los pies apoyados y toma aire.','Dirige tu atención a la próxima operación, de una en una.']];let selectedTechnique=0;
function relax(){screen.innerHTML=`<div class="grid g3">${techniques.map((t,i)=>`<div class="card mode" onclick="selectedTechnique=${i};relaxDetail()"><span class="tag">Técnica ${i+1}</span><h3 style="margin-top:12px">${t[0]}</h3><p class="sub">${t[1]}</p><div style="margin-top:15px;color:#3159dd;font-weight:700">Abrir ejercicio →</div></div>`).join('')}</div><div class="info" style="margin-top:20px">Las instrucciones se leen mediante la función de voz del dispositivo si está disponible. No se proporcionan archivos de audio pregrabados. Puedes interrumpir el ejercicio en cualquier momento.</div>`;}
function relaxDetail(){let t=techniques[selectedTechnique];screen.innerHTML=`<div class="card center"><span class="tag">Técnica ${selectedTechnique+1} de 7</span><h2 style="margin-top:16px">${t[0]}</h2><p class="sub">${t[1]}</p><div id="breathCircle" class="breath">INSPIRA</div><p id="breathStatus" class="sub">Pulsa iniciar para empezar.</p><div class="row" style="justify-content:center;margin-top:20px"><button class="primary" onclick="startBreath()">Iniciar guía</button><button class="ghost" onclick="stopBreath();document.getElementById('breathStatus').textContent='Ejercicio detenido.'">Detener</button><button class="secondary" onclick="stopBreath();route('relax')">Volver</button></div></div>`;}
function speak(str){try{if('speechSynthesis'in window){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(str);u.lang='es-ES';u.rate=.85;speechSynthesis.speak(u)}}catch(e){}}
function startBreath(){stopBreath();let t=techniques[selectedTechnique],step=0;const cycle=()=>{const inhale=step%2===0;const circle=$('breathCircle');if(!circle)return;circle.classList.toggle('in',inhale);circle.textContent=inhale?'INSPIRA':'ESPIRA';$('breathStatus').textContent=inhale?t[2]:t[3];speak(inhale?t[2]:t[3]);step++;if(step>=10){breathTimer=setTimeout(()=>{if($('breathStatus'))$('breathStatus').textContent='Ejercicio terminado.';if($('breathCircle'))$('breathCircle').textContent='FIN';},5000);return}breathTimer=setTimeout(cycle,inhale&&selectedTechnique===1?4000:!inhale&&selectedTechnique===1?6000:4000);};cycle();}
function stopBreath(){clearTimeout(breathTimer);if('speechSynthesis'in window)try{speechSynthesis.cancel()}catch(e){}}
const articles=[['Estrategia: suma por compensación','Cuando sumas 49 + 28, puedes transformar 49 en 50 y calcular 50 + 28 − 1 = 77.'],['Multiplicar por 25','Multiplicar por 25 es equivalente a multiplicar por 100 y dividir entre 4. Por ejemplo, 16 × 25 = 400.'],['Precisión antes que velocidad','En una sesión inicial conviene resolver con seguridad. Cuando mantengas una precisión alta, introduce un límite de tiempo.'],['Propuesta de entrenamiento semanal','Alterna cálculo básico, estrategias, memoria numérica y un simulacro. Compara resultados dentro del mismo nivel.']];
function community(){const posts=state.posts.filter(p=>p.profile===active().id);screen.innerHTML=`<div class="grid g2"><div class="card"><h2>Recursos y consejos</h2>${articles.map(([title,body])=>`<div class="news"><b>${title}</b><p class="sub" style="margin-top:7px">${body}</p></div>`).join('')}</div><div class="card"><h2>Mi cuaderno de entrenamiento</h2><p class="sub">Guarda tus reflexiones, objetivos y estrategias. Las notas son privadas para este navegador.</p><form onsubmit="addPost(event)" style="margin:15px 0"><label class="field">Nueva nota<input id="postTitle" maxlength="80" required placeholder="Ej. Practicar multiplicaciones por 11"></label><label class="field" style="margin-top:10px">Descripción<input id="postText" maxlength="300" required placeholder="¿Qué estrategia has aprendido?"></label><button class="primary" style="margin-top:12px" type="submit">Guardar nota</button></form><div class="divider"></div>${posts.length?posts.slice().reverse().map(x=>`<div class="news"><b>${safe(x.title)}</b><p class="sub" style="margin-top:5px">${safe(x.text)}</p><div class="note">${new Date(x.date).toLocaleDateString('es-ES')}</div></div>`).join(''):'<div class="empty">Aún no tienes notas.</div>'}</div></div>`;}
function addPost(ev){ev.preventDefault();state.posts.push({profile:active().id,date:new Date().toISOString(),title:$('postTitle').value.trim(),text:$('postText').value.trim()});save();community();}
function profiles(){screen.innerHTML=`<div class="split"><section class="card"><h2>Perfiles disponibles</h2>${state.profiles.map(p=>`<div class="listline"><div><b>${safe(p.name)}</b><div class="small muted">${ageNames[p.age]} · ${safe(p.group)} · ${safe(p.country)}</div></div><div class="row"><button class="secondary" onclick="selectProfile('${p.id}')">Elegir</button>${state.profiles.length>1?`<button class="ghost" onclick="removeProfile('${p.id}')">Eliminar</button>`:''}</div></div>`).join('')}<p class="note">Cada perfil conserva sus sesiones en este navegador. Usa un alias para menores.</p></section><section class="card"><h2>Añadir perfil</h2><form onsubmit="addProfile(event)" class="grid"><label class="field">Nombre o alias<input id="newName" maxlength="35" placeholder="Ej. Matemática azul" required></label><label class="field">Edad / etapa<select id="newAge">${Object.entries(ageNames).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select></label><label class="field">Grupo<input id="newGroup" maxlength="35" placeholder="Ej. 1º ESO A"></label><label class="field">País<select id="newCountry"><option value="🇪🇸">España</option><option value="🇫🇷">Francia</option><option value="🇵🇹">Portugal</option><option value="🇬🇧">Reino Unido</option><option value="🌍">Otro</option></select></label><button type="submit" class="primary">Crear perfil</button></form><div class="divider"></div><button class="ghost" onclick="exportBackup()">Exportar copia JSON</button><p class="note">Esta versión no dispone de contraseña ni sincronización. No introduzcas información personal sensible.</p></section></div>`;}
function addProfile(e){e.preventDefault();const id='p'+Date.now();state.profiles.push({id,name:$('newName').value.trim(),age:$('newAge').value,group:$('newGroup').value.trim()||'Individual',country:$('newCountry').value});state.active=id;save();route('profiles');}
function selectProfile(id){state.active=id;save();route('home')};function removeProfile(id){if(!confirm('¿Eliminar este perfil y su historial local?'))return;state.profiles=state.profiles.filter(x=>x.id!==id);state.sessions=state.sessions.filter(x=>x.profile!==id);state.posts=state.posts.filter(x=>x.profile!==id);state.tournaments=state.tournaments.filter(x=>x.profile!==id);if(state.active===id)state.active=state.profiles[0].id;save();route('profiles');}
function exportBackup(){download('MentalMath_copia_seguridad.json',JSON.stringify(state,null,2),'application/json')}
route('home');
</script></body></html>
